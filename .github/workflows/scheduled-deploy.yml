name: Scheduled Pages deploy

# A scheduled run is attributed to the last user who edited its cron line, so this
# workflow only dispatches pages.yml with GITHUB_TOKEN. The Pages run it starts is
# therefore triggered by github-actions[bot].
on:
  schedule:
    - cron: '*/5 * * * *'

permissions: {}

jobs:
  dispatch:
    name: Dispatch GitHub Pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Start the Pages workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main
