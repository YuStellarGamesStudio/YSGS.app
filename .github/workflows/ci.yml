name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      upload-pages-artifact:
        description: Upload the checked build for GitHub Pages deployment
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, audit, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check types, audit dependencies, and build
        run: npm run check

      - name: Share checked build with browser jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: checked-site
          path: dist
          if-no-files-found: error
          retention-days: 1

      - name: Upload checked Pages artifact
        if: ${{ inputs.upload-pages-artifact }}
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
          retention-days: 1

  browsers:
    name: ${{ matrix.os }} / ${{ matrix.browser }}
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - windows-11-arm
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - ubuntu-26.04
          - ubuntu-26.04-arm
        browser: [chromium, firefox, webkit]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Download checked build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: checked-site
          path: dist

      - name: Install browser and system dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Exercise production website
        run: npm run test:browser -- --project=${{ matrix.browser }}

      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-${{ matrix.os }}-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
