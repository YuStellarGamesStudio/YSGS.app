<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browser games and live catalog data from YuStellarGamesStudio." />
    <meta name="color-scheme" content="dark light" />
    <title>YSGS Games — YuStellarGamesStudio</title>
    <link rel="canonical" href="https://ysgs.app/" />
    <meta name="theme-color" content="#05070d" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="YSGS Games" />
    <meta property="og:title" content="YSGS Games — YuStellarGamesStudio" />
    <meta property="og:description" content="Play browser games. Explore live data." />
    <meta property="og:url" content="https://ysgs.app/" />
    <meta property="og:image" content="https://ysgs.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />

    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="zh_TW" />
    <meta property="og:locale:alternate" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="YSGS Games — YuStellarGamesStudio" />

    <meta name="twitter:image" content="https://ysgs.app/og-image.png" />
    <meta name="twitter:image:alt" content="YSGS Games — Play browser games. Explore live data." />
    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      (() => {
        let theme = null;
        try {
          theme = localStorage.getItem('ysgs-theme');
        } catch {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app">
      <noscript>YSGS Games requires JavaScript. · 星語遊戲網需要啟用 JavaScript。 · 星語ゲームズには JavaScript が必要です。</noscript>
    </div>
  </body>
</html>
