<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browser games and live catalog data from YuStellarGamesStudio." />
    <meta name="color-scheme" content="dark light" />
    <title>YSGS Games — YuStellarGamesStudio</title>
    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      (() => {
        let theme = null;
        try {
          theme = localStorage.getItem('ysgs-theme');
        } catch {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app">
      <noscript>YSGS Games requires JavaScript. · 星語遊戲網需要啟用 JavaScript。 · 星語ゲームズには JavaScript が必要です。</noscript>
    </div>
  </body>
</html>
